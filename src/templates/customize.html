<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Sprout</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8f0;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #27ae60; }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            text-decoration: none;
            color: white;
            display: inline-block;
            width: 100%;
            margin-top: 10px;
        }
        .btn-save { background-color: #27ae60; }
        .btn-save:hover { background-color: #219150; }
        .btn-back { background-color: #7f8c8d; }
        .btn-back:hover { background-color: #6c7a7d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Customize Your SPROUT</h1>
        <form action="{{ url_for('customize') }}" method="POST">
            <div class="form-group">
                <label for="name">Pet Name:</label>
                <input type="text" id="name" name="name" value="{{ pet.name }}" required>
            </div>
            <div class="form-group">
                <label for="theme">Theme:</label>
                <select id="theme" name="theme">
                    <option value="Default" {% if pet.theme == 'Default' %}selected{% endif %}>Default</option>
                    <option value="Forest" {% if pet.theme == 'Forest' %}selected{% endif %}>Forest</option>
                    <option value="Ocean" {% if pet.theme == 'Ocean' %}selected{% endif %}>Ocean</option>
                    <option value="Desert" {% if pet.theme == 'Desert' %}selected{% endif %}>Desert</option>
                </select>
            </div>
            <button type="submit" class="btn btn-save">Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-back">Back to Home</a>
        </form>
    </div>
</body>
</html>
